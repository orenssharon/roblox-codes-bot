name: Run Roblox Scraper

on:
  schedule:
    - cron: '0 0,12 * * *' # רץ אוטומטית כל 12 שעות (בחצות ובצהריים לפי שעון UTC)
  workflow_dispatch: # מאפשר כפתור הפעלה ידנית

permissions:
  contents: write # נותן הרשאה לסקריפט לשמור את קובץ ה-JSON בחזרה לריפוזטורי

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper script
        run: python update_codes.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update Roblox codes vault [skip ci]"
          file_pattern: "roblox-codes.json"
